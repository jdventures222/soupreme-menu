<style>
  :root {
    /* sources/brand-colours.json: the logo's red is decorative (4.18 to 1 on white); text and controls in red use the
       same hue darker (5.28 to 1 on white, 5.08 on the paper). Paper is the PDF's; ink its black, softened. */
    --red: #EE2B2D; --red-deep: #D71113;
    --ink: #1A1A1A; --body: #4A4542; --muted: #625B56;
    --ground: #FDFAFA; --surface: #FFFFFF; --line: #DDD3D1; --line-soft: #EFE7E6; --control: #837A74;
    --flag-bg: #FDE9E9; --amber: #9A5A0B; --amber-bg: #FFF3DE; --amber-line: #F0D3A3;

    --display: "Avenir Next Condensed", "Arial Narrow", "Roboto Condensed", sans-serif-condensed, "Helvetica Neue", Arial, sans-serif;
    --text: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --maxw: 720px; --bar-h: 52px; --logo-band: 44px; --thumb: 84px; --ease: cubic-bezier(.2, .8, .2, 1);
  }

  html[lang="zh-Hans"] { --display: "Noto Sans", "Noto Sans SC", sans-serif; --text: "Noto Sans", "Noto Sans SC", sans-serif; }

  bdi, .en-name, address[dir], .web[dir] { unicode-bidi: isolate; }

  * { box-sizing: border-box; }

  html.modal { overflow: hidden; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } *, *::before, *::after { transition-duration: 0s !important; animation-duration: 0s !important; } }
  body { margin: 0; background: var(--ground); color: var(--ink); font-family: var(--text); font-size: 1rem; line-height: 1.5; -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
  html[lang="ko"] body { word-break: keep-all; }
  a { color: var(--red-deep); }
  button { font: inherit; color: inherit; }
  svg { display: block; }
  :focus-visible { outline: 3px solid var(--red-deep); outline-offset: 2px; }
  .wrap { max-width: var(--maxw); margin: 0 auto; padding: 0 16px; }
  #main { min-height: 100vh; }
  /* The diner PDF is the page printed: text only, so a language's menu stays a small download. */
  @media print { .thumb-btn, .shots, .specials img, .thumb-btn picture { display: none !important; } .has-photos .item { grid-template-columns: minmax(0, 1fr) !important; } #main { min-height: 0; } }
  html.lang-loading #main { opacity: .5; }
  @media (min-width: 560px) { .wrap { padding: 0 24px; } }
  .skip { position: absolute; inset-inline-start: -9999px; top: 8px; background: var(--ink); color: #fff; padding: 8px 12px; border-radius: 6px; z-index: 50; }
  .skip:focus { inset-inline-start: 8px; }
  .caps { font-family: var(--display); text-transform: uppercase; letter-spacing: .05em; }
  html[lang="ko"] .caps, html[lang^="zh"] .caps { text-transform: none; letter-spacing: 0; }

  /* Masthead */
  .masthead { background: var(--surface); }

  .brand { display: flex; align-items: center; gap: 12px; padding: 12px 0 12px; }

  .brand picture { display: block; flex: none; line-height: 0; }

  .brand p { margin: 1px 0 0; color: var(--muted); font-size: 0.8125rem; line-height: 1.125rem; }

  /* Language switcher: every language visible in its own script, scrolls only if a narrow screen forces it. */
  .langbar { display: flex; min-height: 54px; gap: 3px; margin: 0 -16px; padding: 5px 16px; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .langbar::-webkit-scrollbar { display: none; }
  @media (min-width: 560px) { .langbar { margin: 0 -24px; padding: 5px 24px; } }
  .seg { flex: 1 1 auto; min-width: max-content; display: inline-flex; align-items: center; justify-content: center; height: 40px; padding: 0 9px; border: 1px solid var(--line); background: var(--surface); color: var(--body); border-radius: 999px; font-size: 0.8125rem; line-height: 1.0625rem; font-weight: 600; white-space: nowrap; cursor: pointer; }
  @media (min-width: 420px) { .seg { padding: 0 14px; font-size: 0.875rem; } }

  .autodetect svg { width: 14px; height: 14px; flex: none; color: var(--control); }

  /* Sticky bar */
  .bar { position: sticky; top: 0; z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
  .bar .wrap { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 4px; padding-top: 4px; padding-bottom: 4px; }
  .row { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; scroll-padding: 0 16px; margin: 0 -16px; padding: 0 16px; }
  /* A strip that scrolls sideways fades at the edge that hides more (the owner, 2026-09-19); the mask is set by fadeStrip. */
  .langbar[data-fade="end"], .row[data-fade="end"] { -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 40px), transparent); mask-image: linear-gradient(to right, #000 calc(100% - 40px), transparent); }
  .langbar[data-fade="start"], .row[data-fade="start"] { -webkit-mask-image: linear-gradient(to left, #000 calc(100% - 40px), transparent); mask-image: linear-gradient(to left, #000 calc(100% - 40px), transparent); }
  .langbar[data-fade="both"], .row[data-fade="both"] { -webkit-mask-image: linear-gradient(to right, transparent, #000 40px, #000 calc(100% - 40px), transparent); mask-image: linear-gradient(to right, transparent, #000 40px, #000 calc(100% - 40px), transparent); }
  html[dir="rtl"] .langbar[data-fade="end"], html[dir="rtl"] .row[data-fade="end"] { -webkit-mask-image: linear-gradient(to left, #000 calc(100% - 40px), transparent); mask-image: linear-gradient(to left, #000 calc(100% - 40px), transparent); }
  html[dir="rtl"] .langbar[data-fade="start"], html[dir="rtl"] .row[data-fade="start"] { -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 40px), transparent); mask-image: linear-gradient(to right, #000 calc(100% - 40px), transparent); }

  @media (min-width: 560px) { .row { margin: 0 -24px; padding: 0 24px; scroll-padding: 0 24px; } }
  .row > * { flex: none; }
  .row .sep { width: 1px; background: var(--line); align-self: stretch; margin: 10px 4px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; height: 44px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 0 14px; font-size: 0.875rem; line-height: 1.125rem; font-weight: 600; cursor: pointer; white-space: nowrap; color: var(--ink); text-decoration: none; }
  .chip[aria-current] { background: var(--red-deep); color: #fff; border-color: var(--red-deep); }
  .chip.tool { background: var(--ground); border-color: var(--ground); }
  .chip.tool svg { width: 17px; height: 17px; color: var(--red-deep); }
  .chip.tool.on { background: var(--red-deep); border-color: var(--red-deep); color: #fff; }
  .chip.tool.on svg { color: #fff; }
  .chip .count { display: inline-grid; place-items: center; min-width: 19px; height: 19px; padding: 0 5px; border-radius: 10px; background: #fff; color: var(--red-deep); font-size: 0.75rem; font-weight: 700; }

  /* Polish: keep the brand typography and palette, with room for long names and text zoom. */

/* System fonts: no remote requests, no claim of SUP's self-hosted subset parity.
   Set both variables so brand heading styles cannot lose script coverage. */
html[lang="ko"] { --text: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; --display: var(--text); }

.langbar bdi:is([lang="ar"], [lang="fa"], [lang="ur"]), .native bdi:is([lang="ar"], [lang="fa"], [lang="ur"]) { font-family: "Noto Sans Arabic", "Geeza Pro", Tahoma, sans-serif; }

  /* A linked dish the filter hides (openLinkedDish); the pill back to search results; the copied-link toast;

/* 2026-09-26: whole dish over a blurred, cover-scaled copy of its own photo.

.photo-tile-blur { display: block; position: relative; width: 100%; height: 100%; overflow: hidden; isolation: isolate; container-type: inline-size; }
.photo-tile-blur .photo-layer { display: block; position: absolute; inset: 0; }
.photo-tile-blur .photo-layer picture { display: block; position: absolute; inset: 0; width: 100%; height: 100%; background: none; transition: none; }
.photo-tile-blur .photo-layer img { display: block; width: 100% !important; height: 100% !important; object-fit: contain !important; object-position: center !important; border-radius: 0 !important; background: transparent !important; transform: translate(var(--tile-x), var(--tile-y)) scale(var(--tile-zoom)) !important; transform-origin: center; clip-path: var(--tile-clip); }
.photo-tile-blur .photo-backdrop { filter: blur(6cqw); pointer-events: none; }
/* The two directional feathers intersect; the vessel ellipse adds a fully

.photo-tile-blur .photo-foreground { -webkit-mask-image: var(--tile-mask); mask-image: var(--tile-mask); -webkit-mask-composite: source-over, source-in; mask-composite: add, intersect; mask-repeat: no-repeat; }

}

}
/* Fonts and pictures that arrive after the jump change the height above the dish, and Safari keeps no scroll anchor, so

function holdItem(id) {

/* Share (findings 14, item 71): the menu from its Sections sheet, a dish from its photo. The native share sheet

function menuUrl() { const u = new URL(location.href); u.hash = ""; return u.href; }

<script>
/* Aggregate, cookieless visit counts (Cloudflare Web Analytics). Inert while the
   token is empty: no token means no third-party request is made at all. Paste the
   site token here to switch counting on for every language and location. */
(() => {
  const ANALYTICS_TOKEN = "";

  const s = document.createElement("script");
  s.defer = true;
